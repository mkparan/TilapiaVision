org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# --- Fixes discovered during original Windows/MIUI build troubleshooting ---
# Without this, a Kotlin-vs-Java JVM target mismatch across plugins is a
# hard error instead of a warning, even with the afterEvaluate fix above
# covering most cases.
kotlin.jvm.target.validation.mode=warning
# Parallel builds were intermittently corrupting the Kotlin daemon cache
# on this setup, producing unreproducible failures on repeated builds.
org.gradle.parallel=false
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
