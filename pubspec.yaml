name: tilapiavision
description: "Offline presumptive screening for hemorrhagic lesions in Nile Tilapia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Camera capture (Section 3.8.2 Input Layer) + gallery import
  camera: ^0.11.0+2
  image_picker: ^1.2.2
  permission_handler: ^11.3.1

  # On-device inference (real model wired in on integration day —
  # see tflite_detection_engine.dart's checklist)
  tflite_flutter: ^0.12.1

  # Local storage — flat CSV log (Section 3.8.3), no relational DB
  csv: ^6.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Image compression for the Visual Archive cache (Section 1.5.1)
  image: ^4.2.0

  # Formatting + sharing
  intl: ^0.19.0
  share_plus: ^10.0.2

  # Icons — matches the shipped UI prototype exactly
  lucide_icons_flutter: ^3.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
